<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Police script pour le sous-titre -->
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Palette & tokens — NOUVELLES COULEURS 2026 */
      --bg:#0C2F22;          /* Fond vert sapin */
      --card:#A98B45;        /* Fond doré des cartes */
      --modal:#08231A;       /* Fond du modal (vert plus foncé) */
      --ink:#F6EDD5;         /* Texte principal (crème) */
      --muted:#C9B98F;       /* Texte secondaire */
      --accent:#C9AC66;      /* Doré clair (survol, confettis) */
      --accent-2:#8FC79A;    /* Vert succès (lisible sur fond foncé) */
      --danger:#E8907F;      /* Rouge erreur (lisible sur fond foncé) */
      --creme:#F6EDD5;       /* Remplace l’ancien rouge des titres */
      --shadow:0 8px 18px rgba(0,0,0,.25); /* Ombre douce */
    }

    html, body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Times New Roman", serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    body{
      position:relative;
      min-height:100vh;
      overflow-x:hidden;
    }
    *{ box-sizing:border-box; }

    /* Décors (nouveau) */
    .deco{
      position:absolute;
      pointer-events:none;
      user-select:none;
      z-index:0;
    }
    .deco-sapin-hg{ top:0; left:0; width:240px; }
    .deco-sapin-hd{ top:0; right:0; width:230px; }
    .deco-sapin-bd{ bottom:0; right:0; width:300px; }
    .deco-boule{ top:0; right:20px; width:230px; }
    .deco-pere-noel{ top:42%; left:0; width:80px; }
    .deco-bonhomme{ top:64%; right:0; width:50px; }

    .wrap{
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:64px auto 0;
      padding:0 20px;
    }

    /* Header */
    .title{
      text-align:center;
      font-size:54px;
      font-weight:500;
      color:var(--creme);
      line-height:1.25;
    }
    .subtitle{
      text-align:center;
      font-family:"Parisienne", cursive;
      font-size:40px;
      color:var(--creme);
      margin-top:6px;
    }

    /* Phrase du bas (nouveau) */
    .phrase-bas{
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:40px auto 0;
      padding:0 20px 40px;
      font-family:"Parisienne", cursive;
      font-size:28px;
      color:var(--creme);
    }

    /* Toolbar */
    .toolbar{
      position:relative;
      z-index:1;
      display:flex;
      gap:12px;
      justify-content:flex-end;
      max-width:1100px;
      margin:28px auto 24px;
      padding:0 20px;
    }
    .pill{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.15);
      padding:8px 12px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
    }
    .btn{
      background:var(--card);
      color:var(--modal);
      border-radius:6px;
      border:none;
      padding:8px 14px;
      font-weight:600;
      cursor:pointer;
      transition:background .2s ease;
    }
    .btn:hover{ transform:translateY(-1px); background:var(--accent); }

    /* Grille */
    .grid{
      display:grid;
      grid-template-columns:repeat(6, minmax(120px, 1fr));
      gap:18px;
      margin-top:28px;
    }

    .door{
      position:relative;
      background:var(--card);
      border:none;
      height:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:200;
      font-size:48px;
      letter-spacing:.5px;
      box-shadow:var(--shadow);
      overflow:hidden;
      transition:all .2s ease-in-out;
      color:var(--creme);
      cursor:pointer;
      font-family:"Times New Roman";
    }
    .door:hover:not(.opened){
      box-shadow:0 10px 18px rgba(0,0,0,.3);
      transform:translateY(-2px);
    }
    .door.locked{
      cursor:not-allowed;
      filter:none;
      opacity:1;
    }
    .door.opened{
      background:var(--bg);
      box-shadow:inset 0 0 0 1px var(--card);
      border:none;
    }
    .door .num{
      position:absolute;
      top:8px; left:10px;
      color:var(--creme);
      font-size:32px;
      font-weight:500;
      z-index:2;
    }
    .door.opened .num{ color:var(--card); }
    .door .icon{
      position:absolute;
      bottom:8px;
      right:8px;
      width:50px;
      height:50px;
      object-fit:contain;
      opacity:0.6;
      transition:opacity .2s ease;
    }
    .door:hover:not(.opened) .icon{ opacity:0.8; }
    .door.opened .icon{ opacity:0.25; }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0;
      background:none;
      backdrop-filter:blur(6px);
      display:none;
      align-items:flex-start; justify-content:center;
      padding-top:12vh; z-index:50;
    }
    .modal{
      width:min(760px, calc(100vw - 32px));
      background:var(--modal);
      border:1px solid var(--card);
      border-radius:8px;
      box-shadow:0 4px 12px rgba(0,0,0,.35);
      overflow:hidden;
      color:var(--ink);
      transform:translateY(0);
      transition:transform .25s ease;
      font-family:"Times New Roman", serif;
    }
    .modal.shake{ animation:shake .3s ease; }
    @keyframes shake{
      0%{transform:translateX(0)} 20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)} 60%{transform:translateX(-5px)}
      80%{transform:translateX(5px)} 100%{transform:translateX(0)}
    }
    .modal-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 33px;
    }
    .modal-title{
      font-size:64px; font-weight:500; color:var(--card);
      letter-spacing:.5px;
    }
    .modal-close{
      background:transparent; border:none; font-size:24px; color:var(--creme);
      cursor:pointer;
    }
    .modal-body{ padding:10px 33px 20px; }

    /* Nom du mini-jeu (nouveau) */
    .jeu{
      font-family:"Parisienne", cursive;
      font-size:30px;
      color:var(--creme);
      margin-bottom:4px;
    }

    .anecdote{
      background:none;
      border:none;
      padding:8px 0 12px;
      font-size:18px;
      line-height:1.6;
      color:var(--creme);
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:18px;
    }
    .hint{
      font-family:"Parisienne";
      font-size:20px;
      color:var(--creme);
      margin-bottom:4px;
    }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
    }

    select{
      flex:1;
      padding:8px 10px;
      border-radius:6px;
      border:1px solid var(--card);
      background:var(--bg);
      color:var(--creme);
      font-family:"Times New Roman", serif;
      font-size:15px;
      outline:none;
    }

    .result{ margin-top:10px; font-weight:700; }
    .ok{ color:var(--accent-2); }
    .ko{ color:var(--danger); }

    .media{
      display:none; margin-top:14px;
    }
    .media iframe, .media video, .media img{
      width:100%;
      height:380px;
      border:0;
      border-radius:12px;
      background:#000;
      animation:popIn .6s ease;
    }
    .media video, .media img{
      object-fit:contain;
      display:block;
    }
    .media audio{ width:100%; }
    @keyframes popIn{
      from{ opacity:0; transform:scale(.95); }
      to{ opacity:1; transform:scale(1); }
    }

    .footer{ margin-top:12px; display:flex; justify-content:flex-end; }

    /* Petit style pour le message gagnant */
    .win-msg{ margin-top:8px; }
    .watch-tip{ margin-top:4px; font-style:italic; opacity:.85; }

    /* Confettis */
    .confetti{ position:fixed; pointer-events:none; inset:0; overflow:hidden; z-index:60; }

    /* RESPONSIVE - TABLETTE */

      .wrap{

      .grid{

      .door{

      .modal-title{

      }

      }

      .anecdote{

      }

      .modal{

        max-height: 90vh;
        overflow-y: auto;
      }

        padding: 16px 20px;
      }

      .modal-title{
        font-size: 48px;
      }

      .modal-close{
        font-size: 28px;
      }

      .modal-body{

      }

      .anecdote{

      }

      .form{
        gap: 8px;
        margin-top: 14px;
      }

      .hint{
        font-size: 18px;
      }

      .row{
        flex-direction: column;
        gap: 8px;

      select, .btn{
        width: 100%;
        padding: 10px 12px;
        font-size: 16px;
      }

      .media{

      }

      .media iframe, .media video, .media img{
        height: 300px;
      }

      /* Décors : on garde seulement les branches du haut, plus petites */
      .deco-sapin-hg, .deco-sapin-hd{ width:110px; }
      .deco-boule, .deco-pere-noel, .deco-bonhomme, .deco-sapin-bd{ display:none; }
      .wrap{ padding-top:70px; }
      .phrase-bas{ font-size:22px; padding:0 12px 30px; }

      }

      .modal-title{
        font-size: 40px;

        font-size: 15px;
      }

      },
      {

        jeu: "La chanson préférée",
        anecdote: "Écoute cet extrait : c’est la chanson préférée de quel collègue ?",
        media: { type:"audio", src:"jeux/jour-18-chanson.mp3" },
        answer: "", // à compléter
        video: ""
      },
      {
        day: 19,
        jeu: "GeoGuessr",
        anecdote: "Cette photo de vacances a été prise par un collègue. Où était-il ?",
        media: { type:"image", src:"jeux/jour-19-geoguessr.jpg" },
        choix: ["Lisbonne","Bali","Kyoto","Marrakech","Reykjavik"], // à adapter
        answer: "", // à compléter
        video: ""
      },
      {
        day: 20,
        jeu: "Qui est le bébé ?",
        anecdote: "Ce bébé est devenu l’un de tes collègues. Sauras-tu le reconnaître ?",
        media: { type:"image", src:"jeux/jour-20-bebe.jpg" },
        answer: "", // à compléter
        video: ""
      },
      {
        day: 21,
        jeu: "Le talent caché",
        anecdote: "L’un de tes collègues cache bien son jeu… À qui appartient ce talent ?",
        media: { type:"image", src:"jeux/jour-21-talent.jpg" },
        answer: "", // à compléter

      },
      {
        day: 22,
        jeu: "Le film préféré",
        anecdote: "C’est le film préféré de l’un de tes collègues. Sauras-tu deviner de qui ?",
        media: { type:"image", src:"jeux/jour-22-film.jpg" },
        answer: "", // à compléter
        video: ""
      },
      {
        day: 23,
        jeu: "Le look d’ado",
        anecdote: "Ce look d’ado appartient à l’un de tes collègues. Qui est-ce ?",
        media: { type:"image", src:"jeux/jour-23-ado.jpg" },
        answer: "", // à compléter
        video: ""
      },
      {
        day: 24,
        jeu: "La chanson préférée",
        anecdote: "Écoute cet extrait : c’est la chanson préférée de quel collègue ?",
        media: { type:"audio", src:"jeux/jour-24-chanson.mp3" },
        answer: "", // à compléter
        video: ""
      }
    ];

    /**********************
     * ÉTAT & PERSISTENCE *
     **********************/
    const STORAGE_KEY = "advent-quiz-2026";
    const state = { dev:false, score:0, opened:{} };

    function load(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) Object.assign(state, JSON.parse(raw));
      }catch(_){}
    }
    function save(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(_){}
    }

    /**************
     * UTILITAIRE *
     **************/
    const today = new Date();
    const month = today.getMonth()+1;
    const date = today.getDate();
    function isUnlocked(day){ return state.dev || (month===12 && day<=date); }
    function $(id){ return document.getElementById(id); }
    function el(tag, attrs={}, children=[]){
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v])=>{
        if(k==="class") node.className=v;
        else if(k==="text") node.textContent=v;
        else node.setAttribute(k,v);
      });
      [].concat(children).forEach(c=> node.appendChild(typeof c==="string" ? document.createTextNode(c) : c));
      return node;
    }
    function norm(s){ return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase(); }
    function check(day, guess){
      const d = DAYS.find(x=>x.day===day);
      const target = norm(d.answer);
      const aliases = (d.aliases||[]).map(norm);
      const g = norm(guess);
      return g===target || aliases.includes(g);
    }
    // Encode les chemins locaux (espaces, accents)
    function encodePath(p){
      return p.startsWith("http") ? p : p.split('/').map(part => encodeURIComponent(part)).join('/');
    }
    // Génère le HTML d'un média (nouveau)
    function mediaHTML(m){
      if(!m || !m.src) return "";
      const src = encodePath(m.src);
      if(m.type==="image")   return `<img src="${src}" alt="">`;
      if(m.type==="audio")   return `<audio controls src="${src}"></audio>`;
      if(m.type==="video")   return `<video controls playsinline src="${src}"></video>`;
      if(m.type==="youtube") return `<iframe src="${m.src}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      return "";
    }

    /************
     *  RENDER  *
     ************/
    const grid = $("grid");

    function renderGrid(){
      grid.innerHTML = "";
      // Ordre fixe (maquette) ou aléatoire si ORDRE = null
      const days = ORDRE
        ? ORDRE.map(n => DAYS.find(x=>x.day===n) || { day:n })
        : [...DAYS].sort(()=> Math.random() - 0.5);

      days.forEach(d=>{
        const opened = !!(state.opened[d.day] && state.opened[d.day].correct);
        const door = el("button", {
          class:`door ${!isUnlocked(d.day)?'locked':''} ${opened?'opened':''}`,
          "data-day":d.day
        });
        door.appendChild(el("span", {class:"badge", text: ""}));
        const dayLabel = String(d.day).padStart(2,'0');
        door.appendChild(el("div", {class:"num", text:dayLabel}));

        if(DAY_IMAGES[d.day]){
          door.appendChild(el("img", {class:"icon", src: DAY_IMAGES[d.day], alt:""}));
        }

        door.addEventListener("click", ()=>{
          if(!isUnlocked(d.day)) return;
          if(!DAYS.find(x=>x.day===d.day)) return; // jour pas encore rempli
          openModal(d.day);
        });
        grid.appendChild(door);
      });
    }

    /************
     *  MODAL   *
     ************/
    const backdrop = $("backdrop"),
          modalBox = $("modalBox"),
          modalTitle = $("modal-title"),
          jeu = $("jeu"),
          anecdote = $("anecdote"),
          mediaJeu = $("mediaJeu"),
          answerSelect = $("answerSelect"),
          submitBtn = $("submit"),
          result = $("result"),
          mediaBox = $("media");

    let currentDay = 1;

    function buildOptions(d){
      answerSelect.innerHTML = "";
      answerSelect.appendChild(el("option",{value:"", text:"— Sélectionne une réponse —"}));
      const liste = d.choix || TEAM;
      liste.forEach(name => answerSelect.appendChild(el("option",{value:name, text:name})));
    }

    function openModal(day){
      currentDay = day;
      const d = DAYS.find(x=>x.day===day);
      modalTitle.textContent = String(day).padStart(2,'0');
      jeu.textContent = d.jeu || "";
      anecdote.textContent = d.anecdote;
      buildOptions(d);

      // Média du jeu (avant réponse)
      mediaJeu.innerHTML = mediaHTML(d.media);
      mediaJeu.style.display = d.media ? "block" : "none";

      const saved = state.opened[day] || {};
      answerSelect.value = saved.answer || "";
      result.textContent = "";
      result.className = "result";
      mediaBox.style.display = "none";
      mediaBox.innerHTML = "";

      backdrop.style.display = "flex";
    }
    function closeModal(){
      backdrop.style.display = "none";
      mediaJeu.innerHTML = "";   // coupe le son / la vidéo
      mediaBox.innerHTML = "";
    }
    $("close").addEventListener("click", closeModal);
    backdrop.addEventListener("click", (e)=>{ if(e.target===backdrop) closeModal(); });

    submitBtn.addEventListener("click", ()=>{
      const guess = answerSelect.value;
      if(!guess){
        result.textContent = "Choisis une réponse avant de valider";
        result.className = "result ko";
        return;
      }

      const good = check(currentDay, guess);
      state.opened[currentDay] = { answer: guess, correct: good };

      if (good) {
        const d = DAYS.find(x => x.day === currentDay);

        result.className = "result ok";
        result.innerHTML = `
          <div class="win-msg">
            <strong>Bien joué&nbsp;! 🎉</strong> C’était <strong>${d.answer}</strong>.
            ${d.video ? '<div class="watch-tip">🎬 Regarde la vidéo ci-dessous&nbsp;!</div>' : ''}
          </div>
        `;

        // Affichage de la vidéo de révélation si configurée
        if (d.video) {
          if (d.video.trim().toLowerCase().endsWith('.mp4')) {
            mediaBox.innerHTML = `<video controls playsinline src="${encodePath(d.video)}"></video>`;
          } else {
            mediaBox.innerHTML = `<iframe src="${d.video}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
          }
          mediaBox.style.display = 'block';
          mediaBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        celebrate();

      } else {
        result.className = "result ko";
        result.textContent = "Loupé…! Essaie une autre réponse 😉";
        modalBox.classList.add("shake");
        setTimeout(()=> modalBox.classList.remove("shake"), 400);
      }

      state.score = Object.values(state.opened).filter(x=>x.correct).length;
      save();
      renderGrid();
    });

    /*****************
     *  TOOLBAR BTN  *
     *****************/
    $("reset").addEventListener("click", ()=>{
      if(confirm("Réinitialiser tes réponses ?")){
        state.opened = {};
        state.score = 0;
        save(); renderGrid();
      }
    });
    $("toggle-dev").addEventListener("click", ()=>{
      state.dev = !state.dev;
      save(); renderGrid();
      $("toggle-dev").textContent = state.dev ? "Mode test (ON)" : "Mode test";
    });

    /****************
     *  CONFETTIS   *
     ****************/
    const confettiCanvas = $("confetti");
    const ctx = confettiCanvas.getContext('2d');
    let particles = [];
    function resize(){ confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function celebrate(){
      for(let i=0;i<160;i++){
        particles.push({x:Math.random()*confettiCanvas.width, y:-10, s:Math.random()*6+2, v:Math.random()*3+2, r:Math.random()*360, a:1});
      }
      requestAnimationFrame(tick);
      setTimeout(()=>{ particles=[]; ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }, 1500);
    }
    function tick(){
      ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      particles.forEach(p=>{
        p.y += p.v; p.r += 6; p.a -= 0.01;
        ctx.save();
        ctx.translate(p.x,p.y); ctx.rotate(p.r*Math.PI/180);
        ctx.globalAlpha = Math.max(p.a, 0);
        const c = Math.floor(p.r)%3;
        ctx.fillStyle = c===0? '#A98B45' : (c===1? '#F6EDD5' : '#C9AC66');
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
        ctx.restore();
      });
      if(particles.some(p=>p.a>0)) requestAnimationFrame(tick);
    }

    /********
     * INIT *
     ********/
    (function init(){
      load();
      const pad = n=> String(n).padStart(2,'0');
      const now = new Date();
      const fmt = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
      $("today-pill").textContent = `Aujourd’hui : ${fmt}`;

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'test') {
          state.dev = true;
          save();
          $('toggle-dev').textContent = 'Mode test (ON)';
      } else {
          state.dev = false;
          $('toggle-dev').style.display = 'none';
          $('reset').style.display = 'none';
      }
      renderGrid();
    })();
  </script>
