<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Calendrier de l’Avent – Cambon Partners</title>

  <!-- Polices : Times New Roman (titre + chiffres, comme l'an dernier), Parisienne (sous-titre),
       Playball (phrase du bas + nom du jeu), Cormorant Garamond (textes du modal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playball&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root{
      /* ====== COULEURS (à ajuster ici) ====== */
      --vert:#0C2F22;        /* fond vert sapin */
      --vert-fonce:#08231A;  /* fond du modal */
      --or:#A98B45;          /* cases dorées */
      --or-clair:#C9AC66;    /* survol des cases */
      --creme:#F6EDD5;       /* textes */
      --rouge:#C2412E;       /* erreur */
      --vert-ok:#8FC79A;     /* bonne réponse */

      /* ====== POLICES ====== */
      --titre:"Times New Roman", Times, serif;   /* titre + chiffres (comme 2025) */
      --sous-titre:"Parisienne", cursive;        /* sous-titre (comme 2025) */
      --script-gras:"Playball", cursive;
      --texte:"Cormorant Garamond", Georgia, serif;
    }

    *{ box-sizing:border-box; }
    html, body{
      margin:0;
      min-height:100%;
      background:var(--vert);
      color:var(--creme);
      font-family:var(--texte);
      -webkit-font-smoothing:antialiased;
    }
    body{
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }

    /* ====== DÉCORS (images PNG détourées) ====== */
    .deco{
      position:absolute;
      pointer-events:none;
      user-select:none;
      z-index:0;
    }
    .deco-sapin-hg{ top:0; left:0; width:clamp(110px, 17vw, 240px); }
    .deco-sapin-hd{ top:0; right:0; width:clamp(110px, 16vw, 230px); }
    .deco-sapin-bd{ bottom:0; right:0; width:clamp(140px, 22vw, 300px); }
    .deco-pere-noel{ top:42%; left:0; width:clamp(50px, 6vw, 80px); }
    .deco-bonhomme{ top:64%; right:0; width:clamp(34px, 3.5vw, 50px); }
    .deco-boule{
      top:0; right:clamp(8px, 1vw, 20px);
      width:clamp(120px, 17vw, 230px);
      transform-origin:50% 0;
      animation:balance 6s ease-in-out infinite;
    }
    @keyframes balance{
      0%,100%{ transform:rotate(-2deg); }
      50%{ transform:rotate(2deg); }
    }

    /* ====== CONTENU ====== */
    .page{
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:0 auto;
      padding:64px 20px 90px;
      text-align:center;
    }
    /* Titre : même police, taille et graisse que l'an dernier */
    h1{
      font-family:var(--titre);
      font-size:54px;
      font-weight:500;
      line-height:1.25;
      margin:0;
    }
    /* Sous-titre : même police et taille que l'an dernier */
    .sous-titre{
      font-family:var(--sous-titre);
      font-size:40px;
      margin:6px 0 28px;
    }

    /* ====== GRILLE ====== */
    .grille{
      display:grid;
      grid-template-columns:repeat(6, 1fr);
      gap:clamp(8px, 1.2vw, 12px);
      max-width:520px;
      margin:0 auto;
    }
    .case{
      position:relative;
      aspect-ratio:1.13 / 1;
      background:var(--or);
      border:none;
      color:var(--creme);
      cursor:pointer;
      overflow:hidden;
      transition:background .2s ease, transform .2s ease;
    }
    /* Chiffre : même police, taille et position que l'an dernier */
    .case .num{
      position:absolute;
      top:8px; left:10px;
      font-family:var(--titre);
      font-size:32px;
      font-weight:500;
      line-height:1;
    }
    .case:hover:not(.verrouillee){ background:var(--or-clair); transform:translateY(-2px); }
    .case:focus-visible{ outline:2px solid var(--creme); outline-offset:3px; }
    .case.verrouillee{ cursor:not-allowed; }
    /* Case déjà jouée : dorure en contour */
    .case.ouverte{
      background:transparent;
      box-shadow:inset 0 0 0 1.5px var(--or);
      color:var(--or);
    }
    .case.ouverte:hover{ background:rgba(169,139,69,.15); }

    .message-attente{
      min-height:24px;
      margin-top:18px;
      font-style:italic;
      font-size:17px;
      opacity:.9;
    }

    .pied{
      position:absolute;
      left:20px; bottom:22px;
      z-index:1;
      font-family:var(--script-gras);
      font-size:clamp(14px, 1.6vw, 17px);
      margin:0;
    }

    /* ====== BARRE MODE TEST (visible avec ?mode=test) ====== */
    .barre-test{
      display:none;
      position:fixed; left:12px; top:12px; z-index:5;
      gap:8px;
    }
    .barre-test.visible{ display:flex; }
    .barre-test button{
      background:var(--vert-fonce);
      color:var(--creme);
      border:1px solid var(--or);
      padding:6px 12px;
      font-family:var(--texte);
      font-size:14px;
      cursor:pointer;
    }

    /* ====== MODAL ====== */
    .fond-modal{
      position:fixed; inset:0;
      background:rgba(4,20,14,.6);
      backdrop-filter:blur(5px);
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:8vh 16px 16px;
      z-index:10;
      overflow-y:auto;
    }
    .fond-modal.visible{ display:flex; }
    .modal{
      width:min(640px, 100%);
      background:var(--vert-fonce);
      border:1.5px solid var(--or);
      padding:22px 32px 30px;
      position:relative;
      text-align:left;
    }
    .modal.secousse{ animation:secousse .35s ease; }
    @keyframes secousse{
      0%,100%{ transform:translateX(0); }
      25%{ transform:translateX(-8px); }
      50%{ transform:translateX(8px); }
      75%{ transform:translateX(-4px); }
    }
    .fermer{
      position:absolute; top:10px; right:14px;
      background:none; border:none;
      color:var(--creme);
      font-size:30px; line-height:1;
      cursor:pointer;
    }
    .modal-jour{
      font-family:var(--titre);
      font-size:64px;
      font-weight:500;
      letter-spacing:.5px;
      color:var(--or);
      line-height:1;
    }
    .modal-jeu{
      font-family:var(--script-gras);
      font-size:26px;
      margin:4px 0 6px;
    }
    .modal-consigne{
      font-size:19px;
      line-height:1.5;
      margin:0 0 16px;
    }

    .media{ margin:0 0 18px; }
    .media img, .media video, .media iframe{
      display:block;
      width:100%;
      max-height:380px;
      object-fit:contain;
      background:#000;
      border:0;
    }
    .media iframe{ height:340px; }
    .media audio{ width:100%; }

    .ligne-reponse{ display:flex; gap:10px; }
    select{
      flex:1;
      padding:10px 12px;
      background:var(--vert);
      color:var(--creme);
      border:1px solid var(--or);
      font-family:var(--texte);
      font-size:17px;
    }
    .btn-valider{
      background:var(--or);
      color:var(--vert-fonce);
      border:none;
      padding:10px 22px;
      font-family:var(--texte);
      font-weight:600;
      font-size:17px;
      cursor:pointer;
    }
    .btn-valider:hover{ background:var(--or-clair); }
    select:focus-visible, .btn-valider:focus-visible, .fermer:focus-visible, .barre-test button:focus-visible{
      outline:2px solid var(--creme); outline-offset:2px;
    }

    .resultat{ margin-top:14px; font-size:19px; line-height:1.5; }
    .resultat.ok{ color:var(--vert-ok); }
    .resultat.ko{ color:#E8907F; }
    .revelation{ display:none; margin-top:14px; }
    .revelation.visible{ display:block; }
    .revelation p{ font-size:18px; line-height:1.55; margin:0 0 12px; }

    /* Confettis */
    #confettis{ position:fixed; inset:0; pointer-events:none; z-index:20; }

    /* ====== RESPONSIVE ====== */
    /* Tailles du titre, sous-titre et chiffres reprises du code 2025 */
    @media (max-width: 1024px){
      h1{ font-size:42px; }
      .sous-titre{ font-size:32px; }
      .case .num{ font-size:28px; top:6px; left:8px; }
      .modal-jour{ font-size:56px; }
    }
    @media (max-width: 768px){
      h1{ font-size:32px; }
      .sous-titre{ font-size:24px; margin-top:4px; }
      .case .num{ font-size:24px; top:4px; left:6px; }
      .modal-jour{ font-size:48px; }
    }
    @media (max-width: 480px){
      h1{ font-size:26px; }
      .sous-titre{ font-size:20px; }
      .case .num{ font-size:20px; }
      .modal-jour{ font-size:40px; }
    }

    @media (max-width: 700px){
      .page{ padding-top:110px; }
      .grille{ grid-template-columns:repeat(4, 1fr); }
      .deco-pere-noel, .deco-bonhomme{ display:none; }
      .deco-boule{ width:96px; }
      .modal{ padding:20px 20px 24px; }
      .ligne-reponse{ flex-direction:column; }
    }
    @media (max-width: 420px){
      .grille{ grid-template-columns:repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce){
      .deco-boule{ animation:none; }
      .case, .modal{ transition:none; animation:none !important; }
    }
  </style>
</head>

<body>
  <!-- DÉCORS : mets tes PNG dans un dossier "images" à côté de index.html.
       Si une image manque, elle se masque toute seule. -->
  <img class="deco deco-sapin-hg"   src="images/sapin-haut-gauche.png" alt="" onerror="this.remove()">
  <img class="deco deco-sapin-hd"   src="images/sapin-haut-droite.png" alt="" onerror="this.remove()">
  <img class="deco deco-boule"      src="images/boule-cambon.png"      alt="" onerror="this.remove()">
  <img class="deco deco-pere-noel"  src="images/pere-noel.png"         alt="" onerror="this.remove()">
  <img class="deco deco-bonhomme"   src="images/bonhomme-neige.png"    alt="" onerror="this.remove()">
  <img class="deco deco-sapin-bd"   src="images/sapin-bas-droite.png"  alt="" onerror="this.remove()">

  <div class="barre-test" id="barreTest">
    <button id="btnReset">Réinitialiser</button>
  </div>

  <main class="page">
    <h1>Calendrier de l’avent – Cambon Partners</h1>
    <p class="sous-titre">Quel mini jeu à découvrir aujourd’hui ?</p>

    <div class="grille" id="grille"></div>
    <p class="message-attente" id="messageAttente" aria-live="polite"></p>
  </main>

  <p class="pied">Que l’aventure de Noël commence…</p>

  <!-- MODAL -->
  <div class="fond-modal" id="fondModal">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalJeu">
      <button class="fermer" id="fermer" aria-label="Fermer">×</button>
      <div class="modal-jour" id="modalJour">1</div>
      <div class="modal-jeu" id="modalJeu"></div>
      <p class="modal-consigne" id="modalConsigne"></p>
      <div class="media" id="media"></div>

      <div class="ligne-reponse">
        <select id="choix" aria-label="Ta réponse"></select>
        <button class="btn-valider" id="valider">Valider</button>
      </div>

      <div class="resultat" id="resultat" aria-live="polite"></div>
      <div class="revelation" id="revelation"></div>
    </div>
  </div>

  <canvas id="confettis"></canvas>

  <script>
    /*****************************************************************
     * 1. L’ÉQUIPE (liste proposée pour les jeux « qui est-ce ? »)
     *****************************************************************/
    const EQUIPE = [
      "Adèle","Alain","Alexandra","Alexandre A.","Alexandre C.","Alexandre H.","Amélie","Anna","Annabelle","Anselme","Aubert",
      "Baptiste","Briac","Camille","Carine","Chadi","David","Elena","Florian","Gaiané","Gabriel","Grégoire","Guillaume E.",
      "Guillaume T.","Jeremy","Jonathan","Jordan","Julien","Juliette","Laurent A.","Laurent N.","Lily","Louis","Luca","Marius",
      "Mathieu","Maxime","Maxime P.","Michael","Min","Morgann","Mostapha","Nathalie","Nicolas O.","Nicolas P.","Nicolas R.",
      "Nicolas SP.","Paul","Pauline","Pierre","Raphaël","Robin","Romain D","Romain P.","Simon","Télio","Thomas A.","Thomas B.",
      "Thomas K.","Victor","Yahia","Younes","Yvette"
    ];

    /*****************************************************************
     * 2. LES 24 JOURS — un mini-jeu par case
     *
     *  jeu        : nom du mini-jeu (affiché en titre)
     *  consigne   : la question posée
     *  media      : ce qu’on montre AVANT de répondre
     *               { type:"image" | "audio" | "video" | "youtube", src:"chemin ou lien" }
     *  choix      : "equipe" → liste des collègues
     *               ou une liste perso → ["Lisbonne","Bali","Tokyo"]
     *  reponse    : la bonne réponse (écrite exactement comme dans la liste)
     *  revelation : ce qu’on montre APRÈS une bonne réponse (facultatif)
     *               { texte:"…", media:{ type:"…", src:"…" } }
     *****************************************************************/
    const JOURS = [
      {
        jour: 1,
        jeu: "Qui est le bébé ?",
        consigne: "Ce bébé est devenu l’un de tes collègues. Sauras-tu le reconnaître ?",
        media: { type:"image", src:"jeux/jour-1-bebe.jpg" },
        choix: "equipe",
        reponse: "Annabelle",
        revelation: { texte:"Et voilà à quoi ressemble ce bébé aujourd’hui !", media:{ type:"image", src:"jeux/jour-1-adulte.jpg" } }
      },
      {
        jour: 2,
        jeu: "La chanson préférée",
        consigne: "Écoute cet extrait : c’est la chanson préférée de quel collègue ?",
        media: { type:"audio", src:"jeux/jour-2-chanson.mp3" },
        choix: "equipe",
        reponse: "Anselme",
        revelation: { texte:"C’était sa chanson fétiche ! Demande-lui pourquoi à la machine à café." }
      },
      {
        jour: 3,
        jeu: "GeoGuessr",
        consigne: "Cette photo de vacances a été prise par un collègue. Où était-il ?",
        media: { type:"image", src:"jeux/jour-3-vacances.jpg" },
        choix: ["Lisbonne","Bali","Kyoto","Marrakech","Reykjavik"],
        reponse: "Kyoto",
        revelation: { texte:"Bien vu, c’était Kyoto !" }
      }
      // Ajoute les jours suivants sur le même modèle…
    ];

    // Ordre d’affichage des cases (identique à la maquette)
    const ORDRE = [10,2,7,5,17,13, 16,14,4,9,23,19, 3,21,12,1,20,24, 8,11,18,6,22,15];

    /*****************************************************************
     * 3. ÉTAT & SAUVEGARDE (reste dans le navigateur de chaque joueur)
     *****************************************************************/
    const CLE = "avent-cambon-2026";
    const etat = { test:false, ouverts:{} };

    function charger(){
      try{ Object.assign(etat, JSON.parse(localStorage.getItem(CLE)) || {}); }catch(e){}
    }
    function sauver(){
      try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){}
    }

    /*****************************************************************
     * 4. OUTILS
     *****************************************************************/
    const $ = id => document.getElementById(id);
    const aujourdhui = new Date();
    function estDebloque(jour){
      return etat.test || (aujourdhui.getMonth() === 11 && jour <= aujourdhui.getDate());
    }
    function normaliser(s){
      return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
    }
    function htmlMedia(m){
      if(!m || !m.src) return "";
      const src = m.src.startsWith("http") ? m.src : m.src.split("/").map(encodeURIComponent).join("/");
      switch(m.type){
        case "image":   return `<img src="${src}" alt="">`;
        case "audio":   return `<audio controls src="${src}"></audio>`;
        case "video":   return `<video controls playsinline src="${src}"></video>`;
        case "youtube": return `<iframe src="${m.src}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        default: return "";
      }
    }

    /*****************************************************************
     * 5. GRILLE
     *****************************************************************/
    function afficherGrille(){
      const grille = $("grille");
      grille.innerHTML = "";
      ORDRE.forEach(jour => {
        const btn = document.createElement("button");
        btn.className = "case";
        if(!estDebloque(jour)) btn.classList.add("verrouillee");
        if(etat.ouverts[jour]?.correct) btn.classList.add("ouverte");
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = String(jour).padStart(2, "0");   // 1 → 01, comme l'an dernier
        btn.appendChild(num);
        btn.setAttribute("aria-label", `Jour ${jour}`);
        btn.addEventListener("click", () => cliquerCase(jour));
        grille.appendChild(btn);
      });
    }

    function cliquerCase(jour){
      const msg = $("messageAttente");
      if(!estDebloque(jour)){
        msg.textContent = `Cette case s’ouvre le ${jour} décembre.`;
        return;
      }
      const donnees = JOURS.find(j => j.jour === jour);
      if(!donnees){
        msg.textContent = `Le mini-jeu du ${jour} décembre arrive bientôt.`;
        return;
      }
      msg.textContent = "";
      ouvrirModal(donnees);
    }

    /*****************************************************************
     * 6. MODAL & MINI-JEU
     *****************************************************************/
    let jourCourant = null;

    function ouvrirModal(d){
      jourCourant = d;
      $("modalJour").textContent = String(d.jour).padStart(2, "0");
      $("modalJeu").textContent = d.jeu;
      $("modalConsigne").textContent = d.consigne;
      $("media").innerHTML = htmlMedia(d.media);

      const liste = d.choix === "equipe" ? EQUIPE : d.choix;
      const select = $("choix");
      select.innerHTML = `<option value="">Choisis une réponse</option>` +
        liste.map(n => `<option value="${n}">${n}</option>`).join("");

      const deja = etat.ouverts[d.jour];
      select.value = deja?.reponse || "";
      $("resultat").textContent = "";
      $("resultat").className = "resultat";
      $("revelation").className = "revelation";
      $("revelation").innerHTML = "";
      if(deja?.correct) montrerRevelation(d);

      $("fondModal").classList.add("visible");
      select.focus();
    }

    function fermerModal(){
      $("fondModal").classList.remove("visible");
      $("media").innerHTML = "";        // coupe le son / la vidéo
      $("revelation").innerHTML = "";
    }

    function montrerRevelation(d){
      $("resultat").className = "resultat ok";
      $("resultat").innerHTML = `Bien joué ! La réponse était <strong>${d.reponse}</strong>.`;
      if(d.revelation){
        $("revelation").innerHTML =
          (d.revelation.texte ? `<p>${d.revelation.texte}</p>` : "") + htmlMedia(d.revelation.media);
        $("revelation").classList.add("visible");
      }
    }

    $("valider").addEventListener("click", () => {
      const d = jourCourant;
      const choix = $("choix").value;
      if(!choix){
        $("resultat").className = "resultat ko";
        $("resultat").textContent = "Choisis une réponse avant de valider.";
        return;
      }
      const bon = normaliser(choix) === normaliser(d.reponse);
      etat.ouverts[d.jour] = { reponse: choix, correct: bon };
      sauver();

      if(bon){
        montrerRevelation(d);
        confettis();
      } else {
        $("resultat").className = "resultat ko";
        $("resultat").textContent = "Raté ! Tente une autre réponse.";
        const m = $("modal");
        m.classList.remove("secousse"); void m.offsetWidth; m.classList.add("secousse");
      }
      afficherGrille();
    });

    $("fermer").addEventListener("click", fermerModal);
    $("fondModal").addEventListener("click", e => { if(e.target.id === "fondModal") fermerModal(); });
    document.addEventListener("keydown", e => { if(e.key === "Escape") fermerModal(); });

    /*****************************************************************
     * 7. CONFETTIS (or, crème, vert)
     *****************************************************************/
    const canvas = $("confettis"), ctx = canvas.getContext("2d");
    let particules = [];
    function redimensionner(){ canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener("resize", redimensionner); redimensionner();

    function confettis(){
      if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const couleurs = ["#A98B45","#F6EDD5","#C9AC66","#2E6B4F"];
      for(let i=0; i<150; i++){
        particules.push({
          x:Math.random()*canvas.width, y:-10 - Math.random()*80,
          t:Math.random()*6+3, v:Math.random()*3+2, r:Math.random()*360,
          a:1, c:couleurs[i % couleurs.length]
        });
      }
      requestAnimationFrame(animer);
    }
    function animer(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particules.forEach(p => {
        p.y += p.v; p.r += 5; p.a -= 0.008;
        ctx.save();
        ctx.translate(p.x,p.y); ctx.rotate(p.r*Math.PI/180);
        ctx.globalAlpha = Math.max(p.a,0);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.t/2,-p.t/2,p.t,p.t*0.6);
        ctx.restore();
      });
      particules = particules.filter(p => p.a > 0);
      if(particules.length) requestAnimationFrame(animer);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    }

    /*****************************************************************
     * 8. DÉMARRAGE
     *  → Mode test : ajoute ?mode=test à la fin de l’adresse
     *    (toutes les cases s’ouvrent + bouton Réinitialiser)
     *****************************************************************/
    charger();
    etat.test = new URLSearchParams(location.search).get("mode") === "test";
    if(etat.test) $("barreTest").classList.add("visible");

    $("btnReset").addEventListener("click", () => {
      if(confirm("Effacer toutes tes réponses ?")){
        etat.ouverts = {}; sauver(); afficherGrille();
      }
    });

    afficherGrille();
  </script>
</body>
</html>
